<h1>Departamentos</h1>
<table>
    <thead>
        <tr>
            <th>Numero</th>
            <th>Nombre</th>
            <th>Localidad</th>
        </tr>
    </thead>
    <tbody>
        @for(dep of arrayDepartamentos;track dep) {
            <tr>
                <td>{{dep.numero}}</td>
                <td>{{dep.nombre}}</td>
                <td>{{dep.localidad}}</td>
                <td>
                    <!-- Esto es la forma con parametros sin usar queryParams, pero no es recomendable porque se ve la informacion en la url
                        <a [routerLink]="['/details', dep.numero, dep.nombre, dep.localidad]">Detalles</a>

                     -->
                        <a [routerLink]="['/details/'+dep.numero+'/'+dep.nombre+'/'+dep.localidad]">Detalles</a>


                </td>
            </tr>
        }
    </tbody>
</table>
