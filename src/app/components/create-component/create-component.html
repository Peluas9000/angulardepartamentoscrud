<h1>Create departamentos</h1>>
<form createForm="ngForm" >
    <label>Id departamento</label>
    <input type="number" name="idDepartamento" ngModel required>
    <label>Nombre departamento</label>
    <input type="text" name="nombreDepartamento" ngModel required>
    <label>Localidad departamento</label>
    <input type="text" name="localidadDepartamento" ngModel required>
    <button type="submit" class="btn btn-primary">Crear departamento</button>
</form>
